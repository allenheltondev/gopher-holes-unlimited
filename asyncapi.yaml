asyncapi: 2.6.0
info:
  title: Gopher Holes Unlimited - Domain Events
  version: 2.0.0
  description: >
    Domain events published by Gopher Holes Unlimited.

    Every state change in the service is committed to DynamoDB together with an
    outbox record in a single transaction (the transactional outbox pattern). An
    outbox relay reads the DynamoDB stream and forwards each record to an
    EventBridge bus as one of the events below. Consumers subscribe with
    EventBridge rules that match on `detail-type`.

    Delivery is at-least-once and consumers must be idempotent. Every event's
    `detail` carries an envelope for exactly that purpose:

      * `eventId` — unique ULID of the originating outbox record; use it as the
        idempotency/dedupe key. It is NOT a reliable ordering sequence (see below).
      * `aggregateId` — id of the entity the event belongs to. Outbox records are
        partitioned by this value for shard locality, giving best-effort in-order
        relay. It is not a hard ordering guarantee: DynamoDB Streams only orders
        records for the same item, EventBridge does not guarantee ordering
        end-to-end, and the ULID is process-local — so consumers that need strict
        order must enforce it themselves rather than sorting by `eventId`.
      * `occurredAt` — ISO-8601 timestamp of the committing transaction.

defaultContentType: application/json

servers:
  eventbridge:
    url: events.{region}.amazonaws.com
    protocol: amazoneventbridge
    description: The application's custom EventBridge bus ("<stack-name>-events").
    variables:
      region:
        default: us-east-1

channels:
  gopher.created:
    subscribe:
      operationId: onGopherCreated
      description: A new gopher was added to the registry.
      message:
        $ref: '#/components/messages/GopherCreated'
  gopher.updated:
    subscribe:
      operationId: onGopherUpdated
      description: One or more fields on a gopher changed.
      message:
        $ref: '#/components/messages/GopherUpdated'
  gopher.status-changed:
    subscribe:
      operationId: onGopherStatusChanged
      description: A gopher's status was updated (history is retained).
      message:
        $ref: '#/components/messages/GopherStatusChanged'
  gopher.deleted:
    subscribe:
      operationId: onGopherDeleted
      description: A gopher was removed from the registry.
      message:
        $ref: '#/components/messages/GopherDeleted'
  hole.created:
    subscribe:
      operationId: onHoleCreated
      description: A new hole was reported.
      message:
        $ref: '#/components/messages/HoleCreated'
  hole.updated:
    subscribe:
      operationId: onHoleUpdated
      description: One or more fields on a hole changed.
      message:
        $ref: '#/components/messages/HoleUpdated'
  hole.status-changed:
    subscribe:
      operationId: onHoleStatusChanged
      description: A hole's status changed (e.g. filled).
      message:
        $ref: '#/components/messages/HoleStatusChanged'
  gopher-hole.linked:
    subscribe:
      operationId: onGopherHoleLinked
      description: A gopher was linked to a hole (directly or by shared location).
      message:
        $ref: '#/components/messages/GopherHoleLinked'
  gopher-hole.unlinked:
    subscribe:
      operationId: onGopherHoleUnlinked
      description: A gopher was unlinked from a hole.
      message:
        $ref: '#/components/messages/GopherHoleUnlinked'

components:
  messageTraits:
    eventbridge:
      headers:
        type: object
        properties:
          source:
            type: string
            const: ghu.api
  schemas:
    envelope:
      type: object
      required: [eventId, aggregateId, occurredAt]
      properties:
        eventId:
          type: string
          description: Unique ULID of the originating outbox record; use as the dedupe key (not an ordering sequence).
          example: 01JBX8P0Q5N6E3S9K2WJ7YQZ4T
        aggregateId:
          type: string
          description: Id of the entity the event belongs to (the outbox partition key).
          example: 01JBX8P0Q5N6E3S9K2WJ7YQZ4T
        occurredAt:
          type: string
          format: date-time
          description: When the committing transaction occurred.
          example: '2026-07-23T12:10:33.932Z'
  messages:
    GopherCreated:
      name: GopherCreated
      title: Gopher Created
      traits:
        - $ref: '#/components/messageTraits/eventbridge'
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              location: { type: object }
    GopherUpdated:
      name: GopherUpdated
      title: Gopher Updated
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id]
            properties:
              id: { type: string }
              changes:
                type: array
                items: { type: string }
    GopherStatusChanged:
      name: GopherStatusChanged
      title: Gopher Status Changed
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id, status]
            properties:
              id: { type: string }
              status:
                type: string
                enum: [at large, trapped, deceased, unknown]
    GopherDeleted:
      name: GopherDeleted
      title: Gopher Deleted
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id]
            properties:
              id: { type: string }
    HoleCreated:
      name: HoleCreated
      title: Hole Created
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id]
            properties:
              id: { type: string }
              description: { type: string }
              status: { type: string, enum: [filled, visible] }
              gopherId: { type: string }
              location: { type: object }
    HoleUpdated:
      name: HoleUpdated
      title: Hole Updated
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id]
            properties:
              id: { type: string }
              changes:
                type: array
                items: { type: string }
    HoleStatusChanged:
      name: HoleStatusChanged
      title: Hole Status Changed
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { type: string, enum: [filled, visible] }
    GopherHoleLinked:
      name: GopherHoleLinked
      title: Gopher Hole Linked
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [gopherId, holeId]
            properties:
              gopherId: { type: string }
              holeId: { type: string }
    GopherHoleUnlinked:
      name: GopherHoleUnlinked
      title: Gopher Hole Unlinked
      payload:
        allOf:
          - $ref: '#/components/schemas/envelope'
          - type: object
            required: [gopherId, holeId]
            properties:
              gopherId: { type: string }
              holeId: { type: string }
