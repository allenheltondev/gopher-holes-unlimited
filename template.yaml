AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Gopher Holes Unlimited (v2)

  A reference serverless service demonstrating the patterns we build with today:
    * A single "mono-Lambda" API with an event-handler controller (AWS Lambda Powertools)
    * Structured logging, metrics (EMF), tracing, and idempotency via Lambda Powertools
    * The transactional outbox pattern: DynamoDB transactional writes emit domain
      events that a stream relay forwards to EventBridge for choreography

Parameters:
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
  MetricsNamespace:
    Type: String
    Default: GopherHolesUnlimited

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 10
    Tracing: Active
    # All three functions bundle from the repo root; each one's esbuild
    # EntryPoints (in its Metadata) are resolved relative to this CodeUri.
    CodeUri: .
    Environment:
      Variables:
        TABLE_NAME: !Ref GopherHolesTable
        POWERTOOLS_METRICS_NAMESPACE: !Ref MetricsNamespace
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_LOGGER_LOG_EVENT: 'false'
  # CORS (including OPTIONS preflight) is handled inside the mono-Lambda by the
  # Powertools `cors()` middleware, so no API Gateway-level CORS is configured
  # here. SAM's `Api.Cors` would require an inline OpenAPI DefinitionBody anyway,
  # which this proxy-integration API intentionally does not use.

Resources:
  # ---------------------------------------------------------------------------
  # Data store: a single DynamoDB table holding gophers, holes, links, gopher
  # status history, and outbox records. Streams feed the outbox relay.
  # ---------------------------------------------------------------------------
  GopherHolesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Powertools idempotency store for de-duplicating create requests.
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true

  # The bus every domain event is published to by the outbox relay.
  DomainEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-events'

  # ---------------------------------------------------------------------------
  # HTTP API + the mono-Lambda controller
  # ---------------------------------------------------------------------------
  GopherHolesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      TracingEnabled: true
      # No API Gateway access/execution logging: both require an account-level
      # CloudWatch Logs role that this stack does not manage, and observability
      # is already covered by Powertools (structured Lambda logs, EMF metrics)
      # and X-Ray. CloudWatch *metrics* need no such role, so we keep those.
      MethodSettings:
        - MetricsEnabled: true
          ResourcePath: '/*'
          HttpMethod: '*'

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node24
        Sourcemap: true
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - src/handlers/api.js
    Properties:
      Handler: src/handlers/api.handler
      Description: Mono-Lambda REST controller for gophers and holes
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: ghu-api
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GopherHolesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref GopherHolesApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref GopherHolesApi
            Path: /{proxy+}
            Method: ANY

  # ---------------------------------------------------------------------------
  # Outbox relay: DynamoDB stream -> EventBridge. A stream filter ensures only
  # outbox records (entityType = "outbox") invoke this function.
  # ---------------------------------------------------------------------------
  OutboxRelayFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node24
        Sourcemap: true
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - src/handlers/outbox-relay.js
    Properties:
      Handler: src/handlers/outbox-relay.handler
      Description: Publishes committed outbox records to EventBridge
      Timeout: 30
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: ghu-outbox-relay
          EVENT_BUS_NAME: !Ref DomainEventBus
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref DomainEventBus
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OutboxRelayDLQ.QueueName
      Events:
        OutboxStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt GopherHolesTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            # One invocation per shard keeps per-aggregate ordering intact.
            ParallelizationFactor: 1
            # The handler returns partial-batch failures and stops at the first
            # failed record, so the stream retries from there. Cap retries and
            # route exhausted records to a DLQ to bound head-of-line blocking.
            MaximumRetryAttempts: 10
            MaximumRecordAgeInSeconds: 86400
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt OutboxRelayDLQ.Arn
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"entityType":{"S":["outbox"]}}}}'

  OutboxRelayDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # ---------------------------------------------------------------------------
  # Choreography consumer: reacts to domain events on the bus (e.g. link a new
  # gopher to holes at its location, propagate hole status onto links).
  # ---------------------------------------------------------------------------
  ChoreographyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: node24
        Sourcemap: true
        External:
          - '@aws-sdk/*'
        EntryPoints:
          - src/handlers/choreography.js
    Properties:
      Handler: src/handlers/choreography.handler
      Description: Handles cross-aggregate reactions to domain events
      Timeout: 30
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: ghu-choreography
          IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GopherHolesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ChoreographyDLQ.QueueName
      # Execution failures (the handler throws) are retried by Lambda's async
      # invocation policy and then routed to the DLQ — distinct from the rule's
      # DeadLetterConfig below, which only catches EventBridge *delivery* failures.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt ChoreographyDLQ.Arn
      Events:
        DomainEvents:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref DomainEventBus
            Pattern:
              detail-type:
                - gopher.created
                - hole.created
                - hole.status-changed
            DeadLetterConfig:
              Arn: !GetAtt ChoreographyDLQ.Arn

  ChoreographyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

Outputs:
  ApiBaseUrl:
    Description: Base URL of the Gopher Holes Unlimited API
    Value: !Sub 'https://${GopherHolesApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
  TableName:
    Description: Name of the single DynamoDB table
    Value: !Ref GopherHolesTable
  DomainEventBusName:
    Description: Name of the domain event bus
    Value: !Ref DomainEventBus
